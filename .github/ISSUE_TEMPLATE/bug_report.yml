name: Bug report
description: Report a problem with peek
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: peek version
      description: Output of `peek --version` (or the commit if running from source).
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Which agent harness were the sessions from?
      options:
        - claude-code
        - codex
        - pi
        - not harness-specific
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact `peek` command you ran (e.g. `peek cost --last 5`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Paste relevant CLI output, stack traces, or a minimal session excerpt.
        **Privacy:** session logs can contain prompts, file paths, and other sensitive content from your own work — redact or trim anything you don't want to share before pasting. `peek` runs entirely local and never uploads session data itself.
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version (`node --version`), and how you installed peek (npm/npx/source).
