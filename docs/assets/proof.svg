<svg
  font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
  height="196"
  viewBox="0 0 700 196"
  width="700"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>peek benchmark proof</title>
  <rect fill="#0d1117" height="196" rx="10" width="700" />
  <text fill="#e6edf3" font-size="16" font-weight="700" x="24" y="30">
    peek — measured, not modeled
  </text>
  <text fill="#8b949e" font-size="11" x="24" y="47">
    self-hosted results; see docs/PERF.md and docs/DESIGN.md
  </text>

  <!-- pair 1: peek list, cold vs warm (totals cache) -->
  <text fill="#e6edf3" font-size="12" x="24" y="79">
    list, cold (11k-file corpus)
  </text>
  <rect fill="#30363d" height="20" rx="4" width="380" x="280" y="65" />
  <text
    fill="#e6edf3"
    font-size="12"
    font-weight="700"
    text-anchor="end"
    x="678"
    y="80"
  >
    6.18s
  </text>

  <text fill="#e6edf3" font-size="12" x="24" y="111">
    list, warm (totals cache)
  </text>
  <rect fill="#3fb950" height="20" rx="4" width="13" x="280" y="97" />
  <text
    fill="#e6edf3"
    font-size="12"
    font-weight="700"
    text-anchor="end"
    x="678"
    y="112"
  >
    0.21s
  </text>

  <!-- pair 2: peek bench, current config vs config-b (model=haiku) -->
  <text fill="#e6edf3" font-size="12" x="24" y="143">
    bench cost, current config
  </text>
  <rect fill="#30363d" height="20" rx="4" width="380" x="280" y="129" />
  <text
    fill="#e6edf3"
    font-size="12"
    font-weight="700"
    text-anchor="end"
    x="678"
    y="144"
  >
    $0.58
  </text>

  <text fill="#e6edf3" font-size="12" x="24" y="175">
    bench cost, config-b (haiku)
  </text>
  <rect fill="#3fb950" height="20" rx="4" width="25" x="280" y="161" />
  <text
    fill="#e6edf3"
    font-size="12"
    font-weight="700"
    text-anchor="end"
    x="678"
    y="176"
  >
    $0.04
  </text>
</svg>
