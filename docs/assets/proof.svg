<svg xmlns="http://www.w3.org/2000/svg" width="700" height="196" viewBox="0 0 700 196" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="700" height="196" rx="10" fill="#0d1117"/>
  <text x="24" y="30" fill="#e6edf3" font-size="16" font-weight="700">peek — measured, not modeled</text>
  <text x="24" y="47" fill="#8b949e" font-size="11">self-hosted results; see docs/PERF.md and docs/PLAN-V2.md</text>

  <!-- pair 1: peek list, cold vs warm (totals cache) -->
  <text x="24" y="79" fill="#e6edf3" font-size="12">list, cold (11k-file corpus)</text>
  <rect x="280" y="65" width="380" height="20" rx="4" fill="#30363d"/>
  <text x="678" y="80" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">6.18s</text>

  <text x="24" y="111" fill="#e6edf3" font-size="12">list, warm (totals cache)</text>
  <rect x="280" y="97" width="13" height="20" rx="4" fill="#3fb950"/>
  <text x="678" y="112" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">0.21s</text>

  <!-- pair 2: peek bench, current config vs config-b (model=haiku) -->
  <text x="24" y="143" fill="#e6edf3" font-size="12">bench cost, current config</text>
  <rect x="280" y="129" width="380" height="20" rx="4" fill="#30363d"/>
  <text x="678" y="144" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">$0.58</text>

  <text x="24" y="175" fill="#e6edf3" font-size="12">bench cost, config-b (haiku)</text>
  <rect x="280" y="161" width="25" height="20" rx="4" fill="#3fb950"/>
  <text x="678" y="176" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">$0.04</text>
</svg>
