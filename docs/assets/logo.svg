  height="200"
  viewBox="0 0 800 200"
  width="800"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>peek</title>
  <rect fill="#0d1117" height="200" rx="16" width="800" />
  <rect
    fill="none"
